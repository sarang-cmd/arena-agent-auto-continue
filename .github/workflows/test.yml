name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jsdom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Run detection and send tests
        run: npm test
      - name: Check the release build packs cleanly
        run: bash scripts/build.sh
      - name: Check the zip the site serves is current
        run: git diff --exit-code site/baton.zip || {
             echo "site/baton.zip is out of date. Run bash scripts/build.sh and commit it."; exit 1; }
